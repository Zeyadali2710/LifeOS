<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="max-width:1600px;margin:0 auto;padding:36px 32px 170px;display:flex;flex-direction:column;gap:24px">
  <section style="display:flex;flex-direction:column;gap:10px">
    <div style="font:500 11px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;color:#30d158">GOALS</div>
    <h1 style="margin:0;font:400 clamp(42px,4.4vw,60px)/0.95 'Instrument Serif',serif;letter-spacing:-0.015em">Momentum is up on 3 of 5 goals.</h1>
  </section>

  <section aria-label="Long-term vision" style="position:relative;border-radius:16px;border:1px solid rgba(10,132,255,0.22);background:radial-gradient(700px 200px at 50% 0%,rgba(10,132,255,0.12),transparent 70%),rgba(255,255,255,0.06);padding:22px 24px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;overflow:hidden">
    <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent,#000 40%,transparent);pointer-events:none"></div>
    <div style="position:relative;display:flex;flex-direction:column;gap:8px;flex:1 1 420px">
      <span style="font:500 10.5px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;color:#64d2ff">LONG-TERM VISION</span>
      <span style="font-family:'Instrument Serif',serif;font-size:29px;line-height:1.12;font-weight:400;letter-spacing:-0.005em;text-wrap:pretty">Build technology that gives people real leverage over their own lives.</span>
    </div>
    <div role="tablist" aria-label="Horizon" style="position:relative;display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(18,18,20,0.6);border:1px solid rgba(255,255,255,0.07)">
      <sc-for list="{{ horizons }}" as="h" hint-placeholder-count="4"><button role="tab" aria-selected="{{ h.on }}" onClick="{{ h.pick }}" style="height:30px;padding:0 12px;border-radius:999px;border:none;background:{{ h.bg }};color:{{ h.color }};font:500 11px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;cursor:pointer;white-space:nowrap">{{ h.label }}</button></sc-for>
    </div>
  </section>

  <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px">
    <sc-for list="{{ targets }}" as="t" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);animation:loFade .2s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 24px 48px -28px rgba(0,0,0,0.8)">
        <div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:2px;background:{{ t.c }}"></span><span style="font:500 10px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;color:#8e8e93;flex:1">{{ t.goal }}</span><span style="font:500 11px 'Familjen Grotesk',sans-serif;color:{{ t.mc }}">{{ t.m }}</span></div>
        <span style="font-size:14px;line-height:1.4">{{ t.t }}</span>
        <div style="height:4px;border-radius:2px;background:rgba(255,255,255,0.06)"><div style="height:100%;width:{{ t.w }};border-radius:2px;background:{{ t.c }}"></div></div>
      </div>
    </sc-for>
  </section>

  <section aria-label="Goal tree" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:12px"><span style="font:500 11px 'Familjen Grotesk',sans-serif;letter-spacing:0.14em;color:#8e8e93">GOAL TREE</span><span style="font:400 11px 'Familjen Grotesk',sans-serif;color:#636366">{{ path }}</span><span style="flex:1;height:1px;background:rgba(255,255,255,0.06)"></span></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:0;overflow-x:auto;border-radius:16px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.05)">
      <sc-for list="{{ levels }}" as="lv" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:8px;padding:14px;border-right:1px solid rgba(255,255,255,0.05);min-height:420px;position:relative">
          <div style="display:flex;align-items:center;gap:8px;padding:2px 4px 6px"><span style="font:500 10.5px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;color:#aeaeb2">{{ lv.label }}</span><span style="font:400 10.5px 'Familjen Grotesk',sans-serif;color:#636366">{{ lv.n }}</span><span style="flex:1"></span><span style="font-family:'Material Symbols Outlined';font-size:16px;color:#636366">{{ lv.arrow }}</span></div>
          <sc-if value="{{ lv.empty }}" hint-placeholder-val="{{ false }}"><div style="padding:16px;border-radius:10px;border:1px dashed rgba(255,255,255,0.08);font-size:12.5px;color:#8e8e93;line-height:1.5">{{ lv.emptyText }}</div></sc-if>
          <sc-for list="{{ lv.nodes }}" as="n" hint-placeholder-count="3">
            <button onClick="{{ n.pick }}" aria-pressed="{{ n.on }}" style="position:relative;display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:11px;border:1px solid {{ n.border }};background:{{ n.bg }};color:#f5f5f7;text-align:left;cursor:pointer;transition:border-color .15s,background .15s" style-hover="border-color:rgba(255,255,255,0.2)">
              <sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;right:-15px;top:50%;width:15px;height:1px;background:{{ n.c }}"></span></sc-if>
              <div style="display:flex;align-items:center;gap:8px;width:100%"><span style="width:7px;height:7px;border-radius:2px;background:{{ n.c }};flex:none"></span><span style="font-size:13.5px;line-height:1.35;flex:1">{{ n.t }}</span></div>
              <div style="display:flex;align-items:center;gap:8px;width:100%">
                <div style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.06)"><div style="height:100%;width:{{ n.w }};border-radius:2px;background:{{ n.c }}"></div></div>
                <span style="font:500 10.5px 'Familjen Grotesk',sans-serif;color:#aeaeb2;width:30px;text-align:right">{{ n.p }}</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;font:400 10.5px 'Familjen Grotesk',sans-serif;color:#8e8e93;width:100%"><span style="color:{{ n.mc }}">{{ n.mom }}</span><span style="flex:1"></span><span>{{ n.meta }}</span></div>
            </button>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = [
  {id:'g1',t:'Launch LifeOS publicly',c:'#0a84ff',p:58,mom:'▲ rising',meta:'by Mar 2027',kids:[
    {id:'o1',t:'Ship 0.9 with agents + approvals',p:62,mom:'▲ rising',meta:'Oct 24',kids:[
      {id:'pr1',t:'LifeOS 0.9 milestone',p:62,mom:'▲ 23 commits/wk',meta:'project',kids:[['Finish event-log migration',1],['Fix 6 failing replay tests',0],['Write approval-flow spec',0],['Ship 0.9 release notes',0]]},
      {id:'pr2',t:'Approval centre UX',p:40,mom:'— steady',meta:'project',kids:[['Payload preview component',1],['Destructive action confirm',0]]}]},
    {id:'o2',t:'Demo at Fishburners demo night',p:80,mom:'▲ rising',meta:'Oct 15',kids:[
      {id:'pr3',t:'Demo prep',p:80,mom:'▲',meta:'project',kids:[['Confirm slot with Hannah',0],['Record 6-min demo',0],['Rehearse at AI Builders',0]]}]},
    {id:'o3',t:'50 beta users',p:12,mom:'▼ slowing',meta:'Jan',kids:[]}]},
  {id:'g2',t:'Land a security engineering internship',c:'#ff9f0a',p:40,mom:'▲ rising',meta:'by Feb 2027',kids:[
    {id:'o4',t:'Ship Sentinel GCP provider',p:41,mom:'— steady',meta:'Nov 3',kids:[{id:'pr4',t:'Sentinel',p:41,mom:'—',meta:'project',kids:[['Review #31',0],['Write GCP docs',0]]}]},
    {id:'o5',t:'Apply to 6 internships',p:33,mom:'▲',meta:'Nov 30',kids:[{id:'pr5',t:'Applications',p:33,mom:'▲',meta:'project',kids:[['Canva (opens Oct 20)',0],['Atlassian',1],['Airwallex security',0]]}]}]},
  {id:'g3',t:'Grow an audience of 10k builders',c:'#ff6482',p:48,mom:'▲ rising',meta:'by Dec 2026',kids:[
    {id:'o6',t:'Post weekly build-in-public',p:70,mom:'▲',meta:'ongoing',kids:[{id:'pr6',t:'Build-in-public series',p:35,mom:'▲',meta:'project',kids:[['Approve post #7',0],['Draft post #8',0]]}]}]},
  {id:'g4',t:'Graduate with distinction',c:'#30d158',p:72,mom:'— steady',meta:'Nov 2027',kids:[
    {id:'o7',t:'HD in COMP3900',p:55,mom:'— steady',meta:'Dec',kids:[{id:'pr7',t:'COMP3900 capstone',p:55,mom:'—',meta:'project',kids:[['Revised architecture diagram',0],['Sprint demo',0]]}]}]},
  {id:'g5',t:'Run a half-marathon',c:'#64d2ff',p:35,mom:'▼ slowing',meta:'May 2027',kids:[
    {id:'o8',t:'Run 25 km a week',p:48,mom:'▼ missed 1 run',meta:'weekly',kids:[]}]}
];
const HZ = {
  'THIS WEEK':[['LAUNCH LIFEOS','Fix replay tests and finish migration','#0a84ff',60,'2 of 4'],['INTERNSHIP','Review Sentinel #31','#ff9f0a',0,'0 of 1'],['AUDIENCE','Publish post #7','#ff6482',50,'awaiting'],['HALF-MARATHON','3 runs, 25 km','#64d2ff',33,'1 of 3']],
  'THIS MONTH':[['LAUNCH LIFEOS','Ship LifeOS 0.9 (Oct 24)','#0a84ff',62,'62%'],['LAUNCH LIFEOS','Demo at Fishburners (Oct 15)','#0a84ff',80,'80%'],['INTERNSHIP','Apply to Canva (Oct 20)','#ff9f0a',20,'prep'],['AUDIENCE','4 posts, +400 followers','#ff6482',55,'+221']],
  'THIS YEAR':[['LAUNCH LIFEOS','Public beta with 50 users','#0a84ff',12,'6 users'],['AUDIENCE','10k followers across platforms','#ff6482',48,'9,732'],['DISTINCTION','WAM above 80','#30d158',72,'81.4'],['INTERNSHIP','Offer for summer 2027','#ff9f0a',40,'in progress']],
  'LONG TERM':[['LAUNCH LIFEOS','LifeOS as a company','#0a84ff',8,'2027+'],['INTERNSHIP','Security engineering career','#ff9f0a',20,'2028'],['AUDIENCE','Known for agent tooling','#ff6482',25,'—'],['HALF-MARATHON','Full marathon','#64d2ff',5,'2028']]
};
class Component extends DCLogic {
  state = { hz:'THIS MONTH', g:'g1', o:'o1', pr:'pr1', done:{} };
  renderVals(){
    const s=this.state;
    const g = T.find(x=>x.id===s.g)||T[0]; const o = g.kids.find(x=>x.id===s.o)||g.kids[0]; const pr = o && (o.kids.find(x=>x.id===s.pr)||o.kids[0]);
    const mc = m=>m.startsWith('▲')?'#30d158':m.startsWith('▼')?'#ff6961':'#aeaeb2';
    const node = (n,on,c,pick,meta)=>({t:n.t,c,on,p:n.p+'%',w:n.p+'%',mom:n.mom,mc:mc(n.mom),meta:meta||n.meta,pick,border:on?c+'88':'rgba(255,255,255,0.07)',bg:on?c+'14':'rgba(255,255,255,0.06)'});
    const levels = [
      {label:'GOAL',arrow:'arrow_forward',nodes:T.map(x=>node(x,x.id===g.id,x.c,()=>this.setState({g:x.id,o:x.kids[0]&&x.kids[0].id,pr:x.kids[0]&&x.kids[0].kids[0]&&x.kids[0].kids[0].id})))},
      {label:'OBJECTIVE',arrow:'arrow_forward',nodes:g.kids.map(x=>node(x,o&&x.id===o.id,g.c,()=>this.setState({o:x.id,pr:x.kids[0]&&x.kids[0].id}))),emptyText:'No objectives yet. Break this goal into 2–3 measurable outcomes.'},
      {label:'PROJECT',arrow:'arrow_forward',nodes:(o?o.kids:[]).map(x=>node(x,pr&&x.id===pr.id,g.c,()=>this.setState({pr:x.id}))),emptyText:'No projects linked. Link a project or ask LifeOS to propose one for this objective.'},
      {label:'TASK',arrow:'',nodes:(pr?pr.kids:[]).map((k,i)=>{ const key=pr.id+i; const d = s.done[key]??!!k[1]; return {...node({t:k[0],p:d?100:0,mom:d?'✓ done':'○ open',meta:''},false,g.c,()=>this.setState(st=>({done:{...st.done,[key]:!d}}))),mc:d?'#30d158':'#8e8e93',bg:d?'rgba(255,255,255,0.02)':'rgba(255,255,255,0.06)'}; }),emptyText:'Pick a project to see its tasks.'}
    ].map(l=>({...l,n:String(l.nodes.length),empty:l.nodes.length===0}));
    return {
      horizons:Object.keys(HZ).map(h=>({label:h,on:h===s.hz,bg:h===s.hz?'rgba(255,255,255,0.1)':'transparent',color:h===s.hz?'#f5f5f7':'#8e8e93',pick:()=>this.setState({hz:h})})),
      targets:HZ[s.hz].map(t=>({goal:t[0],t:t[1],c:t[2],w:t[3]+'%',m:t[4],mc:'#aeaeb2'})),
      levels, path:'VISION → '+g.t.toUpperCase()+(o?' → '+o.t.toUpperCase():'')
    };
  }
}
</script>
</body>
</html>
