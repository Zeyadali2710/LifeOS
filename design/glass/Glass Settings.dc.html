<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="max-width:1280px;margin:0 auto;padding:36px 32px 170px;display:flex;flex-direction:column;gap:24px">
  <section style="display:flex;flex-direction:column;gap:10px">
    <div style="font:500 11px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;color:#aeaeb2">SETTINGS</div>
    <h1 style="margin:0;font:400 clamp(42px,4.4vw,60px)/0.95 'Instrument Serif',serif;letter-spacing:-0.015em">{{ title }}</h1>
  </section>
  <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
    <nav aria-label="Settings sections" style="flex:0 0 200px;display:flex;flex-direction:column;gap:2px;position:sticky;top:20px">
      <sc-for list="{{ sections }}" as="c" hint-placeholder-count="12"><button onClick="{{ c.pick }}" aria-current="{{ c.cur }}" style="display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:999px;border:none;background:{{ c.bg }};color:{{ c.color }};font-size:13.5px;cursor:pointer;text-align:left" style-hover="color:#f5f5f7"><span style="font-family:'Material Symbols Outlined';font-size:18px">{{ c.icon }}</span><span style="flex:1">{{ c.label }}</span><sc-if value="{{ c.warn }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:50%;background:#ff6961"></span></sc-if></button></sc-for>
    </nav>
    <div style="flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
      <p style="margin:0;font-size:14px;color:#aeaeb2;line-height:1.55">{{ desc }}</p>

      <sc-if value="{{ isConnections }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ connections }}" as="a" hint-placeholder-count="8">
            <div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;border:1px solid {{ a.border }};background:rgba(255,255,255,0.06);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);flex-wrap:wrap;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 24px 48px -28px rgba(0,0,0,0.8)">
              <span style="width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);font:600 11px 'Familjen Grotesk',sans-serif;color:#f5f5f7;flex:none">{{ a.mark }}</span>
              <div style="flex:1 1 220px;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:14.5px;font-weight:500">{{ a.name }}</span><span style="font-size:12.5px;color:#8e8e93">{{ a.detail }}</span></div>
              <span style="display:flex;align-items:center;gap:7px;font:600 10.5px 'Familjen Grotesk',sans-serif;letter-spacing:0.14em;color:{{ a.sc }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ a.dot }};border:1px solid {{ a.sc }}"></span>{{ a.status }}</span>
              <button onClick="{{ a.act }}" disabled="{{ a.busy }}" style="height:32px;min-width:110px;padding:0 12px;border-radius:999px;border:{{ a.btnBorder }};background:{{ a.btnBg }};color:{{ a.btnColor }};font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px">
                <sc-if value="{{ a.busy }}" hint-placeholder-val="{{ false }}"><span style="width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);border-top-color:#f5f5f7;animation:loSpin .7s linear infinite"></span></sc-if>{{ a.btn }}
              </button>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isPermissions }}" hint-placeholder-val="{{ false }}">
        <div role="table" style="border-radius:26px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);overflow:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 24px 48px -28px rgba(0,0,0,0.8)">
          <div role="row" style="display:grid;grid-template-columns:180px repeat(5,minmax(96px,1fr));gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);font:500 10px 'Familjen Grotesk',sans-serif;letter-spacing:0.12em;color:#8e8e93;min-width:720px"><span>AGENT</span><sc-for list="{{ permCols }}" as="c" hint-placeholder-count="5"><span>{{ c.t }}</span></sc-for></div>
          <sc-for list="{{ permRows }}" as="r" hint-placeholder-count="5">
            <div role="row" style="display:grid;grid-template-columns:180px repeat(5,minmax(96px,1fr));gap:8px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);align-items:center;min-width:720px">
              <span style="font:500 11px 'Familjen Grotesk',sans-serif;letter-spacing:0.1em;color:{{ r.c }}">{{ r.name }}</span>
              <sc-for list="{{ r.cells }}" as="x" hint-placeholder-count="5"><button onClick="{{ x.cycle }}" title="Click to change" style="height:28px;border-radius:999px;border:1px solid {{ x.border }};background:{{ x.bg }};color:{{ x.color }};font:600 10px 'Familjen Grotesk',sans-serif;letter-spacing:0.1em;cursor:pointer">{{ x.v }}</button></sc-for>
            </div>
          </sc-for>
        </div>
        <span style="font-size:12.5px;color:#8e8e93">Click a cell to cycle NEVER → ASK FIRST → ALLOWED. Deleting and paying can never be set to ALLOWED.</span>
      </sc-if>

      <sc-if value="{{ isRows }}" hint-placeholder-val="{{ false }}">
        <div style="border-radius:26px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 24px 48px -28px rgba(0,0,0,0.8)">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap">
              <div style="flex:1 1 260px;display:flex;flex-direction:column;gap:3px"><span style="font-size:14px">{{ r.k }}</span><span style="font-size:12.5px;color:#8e8e93;line-height:1.45">{{ r.d }}</span></div>
              <sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ false }}"><button role="switch" aria-checked="{{ r.on }}" aria-label="{{ r.k }}" onClick="{{ r.toggle }}" style="width:40px;height:22px;border-radius:999px;border:none;background:{{ r.track }};position:relative;cursor:pointer;transition:background .15s;flex:none"><span style="position:absolute;top:3px;left:{{ r.knob }};width:16px;height:16px;border-radius:50%;background:#f5f5f7;transition:left .15s"></span></button></sc-if>
              <sc-if value="{{ r.isValue }}" hint-placeholder-val="{{ false }}"><span style="font:400 12.5px 'Familjen Grotesk',sans-serif;color:#f5f5f7">{{ r.v }}</span></sc-if>
              <sc-if value="{{ r.isSeg }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:2px;padding:3px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)"><sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="height:26px;padding:0 10px;border-radius:999px;border:none;background:{{ o.bg }};color:{{ o.color }};font-size:12px;cursor:pointer">{{ o.t }}</button></sc-for></div></sc-if>
              <sc-if value="{{ r.isButton }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.press }}" style="height:30px;padding:0 12px;border-radius:999px;border:1px solid {{ r.bb }};background:transparent;color:{{ r.bc }};font-size:12.5px;cursor:pointer">{{ r.v }}</button></sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SECTIONS = [['Profile','person'],['Accounts','account_circle'],['Integrations','extension'],['AI','auto_awesome'],['Agents','memory'],['Permissions','admin_panel_settings'],['Notifications','notifications'],['Security','lock'],['Appearance','contrast'],['Automation','bolt'],['Data','database'],['System','dns']];
const DESC = {Profile:'How LifeOS knows you. Used by agents for tone, location and relevance.',Accounts:'Accounts LifeOS reads from and, with approval, acts on.',Integrations:'Developer tools and services connected to your projects.',AI:'Models, memory and voice for the Orchestrator and agents.',Agents:'Turn agents on or off and set their schedules.',Permissions:'What each agent may do. Anything external defaults to ASK FIRST.',Notifications:'When LifeOS interrupts you, and when it waits.',Security:'Sign-in, sessions and encryption.',Appearance:'Theme, density and motion.',Automation:'Rules that trigger agents without you asking.',Data:'Export, retention and deletion.',System:'Version, status and diagnostics.'};
const ACC = {
  Accounts:[['GH','GitHub','@zeyad · 23 repositories','CONNECTED'],['GC','Google Calendar','zeyad.dev@gmail.com · 3 calendars','CONNECTED'],['GM','Gmail','zeyad.dev@gmail.com · read + draft','CONNECTED'],['GD','Google Drive','Token expired at 19:30 · 212 files waiting','RECONNECT'],['IN','LinkedIn','linkedin.com/in/zeyad · analytics + publishing','CONNECTED'],['IG','Instagram','@zeyad.builds · business account','CONNECTED'],['TT','TikTok','Not connected · analytics unavailable','NOT CONNECTED'],['X','X / Twitter','Not connected','NOT CONNECTED']],
  Integrations:[['CC','Claude Code','4 workspaces · ~/dev · last session 19:41','CONNECTED'],['VC','Vercel','2 projects · preview + production','CONNECTED'],['FL','Fly.io','ledgerline-api · syd region','CONNECTED'],['MU','Meetup + Humanitix','event search · Sydney','CONNECTED'],['NT','Notion import','one-time import of old notes','NOT CONNECTED'],['SL','Slack','UNSW FinTech Society workspace','NOT CONNECTED']]
};
const STS = {CONNECTED:['#30d158','#30d158'],'NOT CONNECTED':['#8e8e93','transparent'],RECONNECT:['#ff6961','#ff6961']};
const AGENTS = [['ORCHESTRATOR','#64d2ff'],['CAREER','#ff9f0a'],['SOCIAL','#ff6482'],['OUTREACH','#64d2ff'],['ORGANIZATION','#30d158']];
const PCOLS = ['Read data','Send email','Publish','Create events','Delete'];
const P0 = [['ALLOWED','NEVER','NEVER','NEVER','NEVER'],['ALLOWED','NEVER','NEVER','NEVER','ASK FIRST'],['ALLOWED','NEVER','ASK FIRST','NEVER','NEVER'],['ALLOWED','ASK FIRST','NEVER','ASK FIRST','NEVER'],['ALLOWED','NEVER','NEVER','ASK FIRST','NEVER']];
const PV = {ALLOWED:['#30d158','rgba(48,209,88,0.08)','rgba(48,209,88,0.25)'],'ASK FIRST':['#ff9f0a','rgba(255,159,10,0.08)','rgba(255,159,10,0.25)'],NEVER:['#8e8e93','transparent','rgba(255,255,255,0.08)']};
class Component extends DCLogic {
  state = { sec:'Accounts', status:{}, busy:{}, perms:P0, tog:{}, seg:{} };
  componentWillUnmount(){ (this.tm||[]).forEach(clearTimeout); }
  renderVals(){
    const s=this.state, nav=this.props.nav||{}, toast=m=>nav.toast&&nav.toast(m);
    const conn = (ACC[s.sec]||[]).map(a=>{ const st = s.status[a[1]]||a[3]; const busy=!!s.busy[a[1]]; const c=STS[st];
      return {mark:a[0],name:a[1],detail:st==='CONNECTED'&&a[3]!=='CONNECTED'?'Connected just now':a[2],status:st,sc:c[0],dot:c[1],busy,border:st==='RECONNECT'?'rgba(255,69,58,0.3)':'rgba(255,255,255,0.07)',
        btn:busy?'Connecting':st==='CONNECTED'?'Manage':st==='RECONNECT'?'RECONNECT':'Connect',
        btnBg:st==='RECONNECT'?'#f5f5f7':st==='NOT CONNECTED'?'#0a84ff':'transparent',btnColor:st==='CONNECTED'?'#f5f5f7':'#121214',btnBorder:st==='CONNECTED'?'1px solid rgba(255,255,255,0.12)':'none',
        act:()=>{ if (st==='CONNECTED'){ toast(a[1]+' · scopes and data access'); return; } this.setState(x=>({busy:{...x.busy,[a[1]]:true}})); this.tm=this.tm||[]; this.tm.push(setTimeout(()=>{ this.setState(x=>({busy:{...x.busy,[a[1]]:false},status:{...x.status,[a[1]]:'CONNECTED'}})); toast(a[1]+' connected'); },1200)); }}; });
    const T = (k,d,def)=>({k,d,isToggle:true,on:s.tog[k]??def,track:(s.tog[k]??def)?'#0a84ff':'rgba(255,255,255,0.12)',knob:(s.tog[k]??def)?'21px':'3px',toggle:()=>this.setState(x=>({tog:{...x.tog,[k]:!(x.tog[k]??def)}}))});
    const V = (k,d,v)=>({k,d,isValue:true,v});
    const S = (k,d,opts,def)=>({k,d,isSeg:true,opts:opts.map(t=>{ const on=(s.seg[k]??def)===t; return {t,on,bg:on?'rgba(255,255,255,0.1)':'transparent',color:on?'#f5f5f7':'#8e8e93',pick:()=>this.setState(x=>({seg:{...x.seg,[k]:t}}))}; })});
    const B = (k,d,v,danger)=>({k,d,isButton:true,v,bb:danger?'rgba(255,69,58,0.4)':'rgba(255,255,255,0.12)',bc:danger?'#ff6961':'#f5f5f7',press:()=>toast(v+'…')});
    const ROWS = {
      Profile:[V('Name','Shown in greetings and drafts','Zeyad'),V('Location','Used for events and travel time','Sydney, NSW'),V('Time zone','','AEDT (UTC+11)'),V('Interests','Weights event and content relevance','cybersecurity · fintech · AI · startups'),S('Writing tone','Default for drafts',['Calm','Direct','Warm'],'Calm')],
      AI:[S('Orchestrator model','Larger is slower but plans better',['Small','Medium','Large'],'Large'),T('Long-term memory','Remember preferences and past decisions across sessions',true),T('Voice input','Hold ⌥Space to talk to LifeOS',false),S('Explain actions','How much of the agent trace to show',['Minimal','Steps','Full'],'Steps')],
      Agents:AGENTS.map(([n])=>T(n.charAt(0)+n.slice(1).toLowerCase()+' Agent',n==='ORCHESTRATOR'?'Required for all other agents':'Runs on schedule and when asked',true)),
      Notifications:[S('Interrupt me for','Anything else waits in Notifications',['Urgent','Important','Everything'],'Important'),T('Quiet hours 23:00–07:00','Approvals still queue silently',true),T('Daily briefing at 07:30','Summary from the Orchestrator',true),T('Agent completions','Notify when a long run finishes',false)],
      Security:[V('Sign-in','Passkey + device','2 devices'),T('Require passkey for approvals','For publish, send and delete',true),V('Encryption','Local data at rest','AES-256 · on'),B('Active sessions','MacBook Pro · iPhone 16','Review sessions')],
      Appearance:[S('Theme','',['Night','Dusk','Light'],'Night'),S('Density','Spacing across the app',['Comfortable','Compact'],'Comfortable'),T('Reduce motion','Also follows your system setting',false),T('Ambient lighting','Subtle gradients behind content',true)],
      Automation:[T('When a PR fails, ask Career Agent to triage','GitHub trigger · 4 repos',true),T('When an event scores above 85, notify me','Outreach trigger',true),T('Every Sunday 18:00, prepare weekly review','Schedule · Organization Agent',true),B('New automation','Build with natural language','Create rule')],
      Data:[V('Storage','Local + encrypted cloud backup','2.4 GB'),S('Keep agent run logs','',['30 days','90 days','Forever'],'90 days'),B('Export everything','JSON + Markdown archive','Export'),B('Delete all data','Removes local data and backups. Asks for passkey.','Delete…',true)],
      System:[V('Version','','LifeOS 0.9.0-beta.4'),V('Status','All services','● Operational'),V('Agents','','6 online · 3 running'),B('Diagnostics','Copy a report for support','Copy report')]
    };
    const isConn = !!ACC[s.sec], isPerm = s.sec==='Permissions';
    const sectionsOut = SECTIONS.map(([l,icon])=>({label:l,icon,cur:l===s.sec?'page':undefined,bg:l===s.sec?'rgba(255,255,255,0.05)':'transparent',color:l===s.sec?'#f5f5f7':'#aeaeb2',warn:l==='Accounts'&&!s.status['Google Drive'],pick:()=>this.setState({sec:l})}));
    return {
      title:s.sec, desc:DESC[s.sec], sections:sectionsOut,
      isConnections:isConn, isPermissions:isPerm, isRows:!isConn&&!isPerm, connections:conn,
      permCols:PCOLS.map(t=>({t:t.toUpperCase()})),
      permRows:AGENTS.map(([n,c],i)=>({name:n,c,cells:s.perms[i].map((v,j)=>({v,color:PV[v][0],bg:PV[v][1],border:PV[v][2],cycle:()=>{ const order=['NEVER','ASK FIRST','ALLOWED']; let nx=order[(order.indexOf(v)+1)%3]; if (j===4 && nx==='ALLOWED') nx='NEVER'; this.setState(x=>({perms:x.perms.map((r,ri)=>ri!==i?r:r.map((cv,ci)=>ci===j?nx:cv))})); }}))})),
      rows:ROWS[s.sec]||[]
    };
  }
}
</script>
</body>
</html>
