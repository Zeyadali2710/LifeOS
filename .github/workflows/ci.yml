name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: lifeos, POSTGRES_PASSWORD: lifeos, POSTGRES_DB: lifeos }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lifeos:lifeos@localhost:5433/lifeos
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0000
      BETTER_AUTH_URL: http://localhost:3000
      LIFEOS_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
